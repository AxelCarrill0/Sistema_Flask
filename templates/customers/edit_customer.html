{% extends 'layout.html' %}

{% block custom_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">
{% endblock %}

{% block titulo %}Editar Cliente - Sistema Mueblería{% endblock %}

{% block contenido %}

<div class="edit-card">

    <h2>Editar Cliente</h2>

    <form action="/clientes/actualizar/{{ cliente.0 }}" method="POST">

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ cliente.1 }}"
                required>
        </div>

        <div class="form-group">
            <label for="cedula">Cédula</label>
            <input
                type="text"
                id="cedula"
                name="cedula"
                value="{{ cliente.2 }}"
                required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input
                type="text"
                id="telefono"
                name="telefono"
                value="{{ cliente.3 }}">
        </div>

        <div class="form-group">
            <label for="correo">Correo</label>
            <input
                type="email"
                id="correo"
                name="correo"
                value="{{ cliente.4 }}">
        </div>

        <div class="form-group">
            <label for="direccion">Dirección</label>
            <textarea
                id="direccion"
                name="direccion"
                rows="3">{{ cliente.5 }}</textarea>
        </div>

        <div class="button-group">

            <button type="submit" class="btn-save">
                Guardar Cambios
            </button>

            <a href="/clientes" class="btn-cancel">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
