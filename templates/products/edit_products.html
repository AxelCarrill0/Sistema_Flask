{% extends 'layout.html' %}

{% block custom_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">
{% endblock %}

{% block titulo %}Editar Producto - Sistema Mueblería{% endblock %}

{% block contenido %}
<div class="edit-card">
    <h2>Editar Producto</h2>
    <form action="/productos/actualizar/{{ producto.0 }}" method="POST">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.1 }}" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3">{{ producto.2 }}</textarea>
        </div>
        <div class="form-group">
            <label for="material">Material</label>
            <input type="text" id="material" name="material" value="{{ producto.3 }}" required>
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" step="0.01" value="{{ producto.4 }}" required>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" value="{{ producto.5 }}" required>
        </div>
        <div class="form-group">
            <label for="id_categoria">Categoría</label>
            <select id="id_categoria" name="id_categoria" required>
                <option value="">Seleccione una categoría</option>
                {% for cat in categorias %}
                <option value="{{ cat.0 }}" {% if cat.0 == producto.6 %}selected{% endif %}>
                    {{ cat.1 }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="button-group">
            <button type="submit" class="btn-save">Guardar Cambios</button>
            <a href="/productos" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
